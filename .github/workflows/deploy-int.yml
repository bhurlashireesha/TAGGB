name: Deploy INT and Create Release Tag

on:
  push:
    branches: [int]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-int
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: int
    timeout-minutes: 60
    env:
      SF_TARGET_ORG: INT
      SF_TEST_LEVEL: RunLocalTests
      SGD_VERSION: 7.2.0

    steps:
      - name: Checkout merged INT revision with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Salesforce CLI and SGD
        run: |
          npm install --global @salesforce/cli@2
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"

      - name: Authenticate to INT
        env:
          SFDX_AUTH_URL: ${{ secrets.INT_SFDX_AUTH_URL }}
        run: ./scripts/authenticate.sh "$SF_TARGET_ORG"

      - name: Deploy delta to INT
        run: ./scripts/deploy-delta.sh deploy delta "$SF_TARGET_ORG" "$SF_TEST_LEVEL"

      - name: Build immutable INT tag and component ledger
        run: |
          tag="int-$(date -u '+%Y%m%d-%H%M%S')-${GITHUB_SHA::8}"
          ./scripts/build-component-ledger.sh delta "$tag" "${{ github.event.before }}" "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Successful INT deployment"
          git push origin "refs/tags/$tag"

      - name: Create GitHub release with component version map
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            delta/component-version-map.csv \
            delta/package/package.xml \
            --title "$RELEASE_TAG" \
            --notes "INT deployment succeeded. Revision: $GITHUB_SHA"
