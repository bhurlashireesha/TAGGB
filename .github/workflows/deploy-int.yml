# Workflow name shown in GitHub Actions UI
name: Deploy INT and Create Release Tag

on:
  # Trigger when code is pushed to the int branch
  push:
    branches: [int]
  # Allow manual triggering with an optional baseline commit/tag
  workflow_dispatch:
    inputs:
      from_ref:
        description: Optional baseline commit or INT tag
        required: false
        type: string

# Permissions for this workflow (needed to push tags/releases)
permissions:
  contents: write

# Ensure only one INT deploy runs at a time
concurrency:
  group: deploy-int
  cancel-in-progress: false

jobs:
  deploy:
    # Extra guard: only run on push events to int branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/int'
    runs-on: ubuntu-latest
    environment: int
    timeout-minutes: 120
    env:
      SF_TARGET_ORG: INT          # Target Salesforce org alias
      SGD_VERSION: 7.2.0          # Version of sfdx-git-delta plugin

    steps:
      # Step 1: Checkout the merged commit with full history
      - name: Checkout merged INT revision with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Step 2: Install Salesforce CLI and sfdx-git-delta plugin
      - name: Install Salesforce CLI and SGD
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @salesforce/cli@2
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf version
          sf plugins

      # Step 3: Resolve baseline commit/tag for delta generation
      - name: Resolve INT delta baseline
        id: baseline
        shell: bash
        env:
          MANUAL_FROM_REF: ${{ inputs.from_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          # Use manual input if provided, otherwise find latest int-* tag
          if [[ -n "$MANUAL_FROM_REF" ]]; then
            from_ref="$MANUAL_FROM_REF"
          else
            from_ref="$(git tag --merged "$GITHUB_SHA" --list 'int-*' --sort=-creatordate | head -n 1 || true)"
            if [[ -z "$from_ref" ]]; then
              from_ref="${PUSH_BEFORE_SHA:-}"
            fi
          fi
          # Fail if no baseline found
          if [[ -z "$from_ref" || "$from_ref" =~ ^0+$ ]]; then
            echo "No baseline exists. Run manually with a known from_ref for the first INT deployment."
            exit 1
          fi
          git rev-parse --verify "${from_ref}^{commit}"
          echo "from_ref=$from_ref" >> "$GITHUB_OUTPUT"
          echo "Using baseline: $from_ref"

      # Step 4: Generate delta package between baseline and current commit
      - name: Generate merged delta
        shell: bash
        run: ./scripts/generate-delta.sh "${{ steps.baseline.outputs.from_ref }}" "$GITHUB_SHA" delta

      # Step 5: Select tests to run (fallback to RunLocalTests if none found)
      - name: Select deployment tests
        id: tests
        shell: bash
        run: ./scripts/select-tests.sh delta RunLocalTests

      # Step 6: Authenticate to INT org using stored auth URL
      - name: Authenticate to INT
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: ./scripts/authenticate.sh "$SF_TARGET_ORG"

      # Step 7: Deploy delta to INT org
      - name: Deploy delta to INT
        id: deploy
        shell: bash
        run: ./scripts/deploy-delta.sh deploy delta "$SF_TARGET_ORG" "${{ steps.tests.outputs.test_level }}" "${{ steps.tests.outputs.tests }}"

      # Step 8: Build immutable INT tag and component ledger if changes deployed
      - name: Build immutable INT tag and component ledger
        if: steps.deploy.outputs.has_changes == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="int-$(date -u '+%Y%m%d-%H%M%S')-${GITHUB_SHA::8}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ./scripts/build-component-ledger.sh delta "$tag" "${{ steps.baseline.outputs.from_ref }}" "$GITHUB_SHA"

      # Step 9: Create and push annotated Git tag
      - name: Create and push annotated tag
        if: steps.deploy.outputs.has_changes == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Successful INT deployment from ${{ steps.baseline.outputs.from_ref }} to $GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      # Step 10: Create GitHub release with artifacts
      - name: Create GitHub release
        if: steps.deploy.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          files=(delta/component-version-map.csv delta/package/package.xml)
          [[ -f delta/destructiveChanges/destructiveChanges.xml ]] && files+=(delta/destructiveChanges/destructiveChanges.xml)
          gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_TAG" --notes "INT deployment succeeded. Baseline: ${{ steps.baseline.outputs.from_ref }}. Revision: $GITHUB_SHA."

      # Step 11: Upload deployment evidence as artifacts
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-deployment-${{ github.run_number }}
          path: |
            delta/package/package.xml
            delta/destructiveChanges/destructiveChanges.xml
            delta/component-version-map.csv
            delta/detected-tests.txt
            deployment-result.json
          if-no-files-found: ignore
          retention-days: 90

      # Step 12: Logout and cleanup auth files
      - name: Logout and cleanup
        if: always()
        shell: bash
        run: |
          sf org logout --target-org "$SF_TARGET_ORG" --no-prompt || true
          rm -f .sf-auth-url.txt
