name: Deploy SIT and Create Release Tag

on:
  push:
    branches: [sit]
  workflow_dispatch:
    inputs:
      from_ref:
        description: Optional baseline commit or SIT tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-sit
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip sit deploy]')
    runs-on: ubuntu-latest
    environment: sit
    timeout-minutes: 60
    env:
      SF_TARGET_ORG: SIT
      SF_TEST_LEVEL: RunLocalTests
      SGD_VERSION: 7.2.0

    steps:

      - name: Checkout merged SIT revision with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Salesforce CLI and SGD
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @salesforce/cli@2
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf version
          sf plugins

      - name: Resolve delta baseline
        id: baseline
        shell: bash
        env:
          MANUAL_FROM_REF: ${{ inputs.from_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ -n "${MANUAL_FROM_REF:-}" ]]; then
            from_ref="$MANUAL_FROM_REF"
          else
            from_ref="$(git tag --merged "$GITHUB_SHA" --list 'sit-*' --sort=-creatordate | head -n 1 || true)"
            if [[ -z "$from_ref" ]]; then
              from_ref="${PUSH_BEFORE_SHA:-}"
            fi
          fi
          if [[ -z "$from_ref" || "$from_ref" =~ ^0+$ ]]; then
            echo "No baseline exists. Run manually with a known from_ref for the first deployment."
            exit 1
          fi
          git rev-parse --verify "${from_ref}^{commit}"
          echo "from_ref=$from_ref" >> "$GITHUB_OUTPUT"
          echo "Using baseline: $from_ref"
          
      - name: Make scripts executable
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ls -la scripts

      - name: Generate merged delta
        shell: bash
        run: ./scripts/generate-delta.sh "${{ steps.baseline.outputs.from_ref }}" "$GITHUB_SHA" delta

      - name: Authenticate to SIT
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: ./scripts/authenticate.sh "$SF_TARGET_ORG"

      - name: Deploy delta to SIT
        id: deploy
        shell: bash
        run: ./scripts/deploy-delta.sh deploy delta "$SF_TARGET_ORG" "$SF_TEST_LEVEL"

      - name: Build immutable SIT tag and component ledger
        if: steps.deploy.outputs.has_changes == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="sit-$(date -u '+%Y%m%d-%H%M%S')-${GITHUB_SHA::8}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ./scripts/build-component-ledger.sh delta "$tag" "${{ steps.baseline.outputs.from_ref }}" "$GITHUB_SHA"

      - name: Create and push annotated tag
        if: steps.deploy.outputs.has_changes == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Successful SIT deployment from ${{ steps.baseline.outputs.from_ref }} to $GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release with component version map
        if: steps.deploy.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            delta/component-version-map.csv \
            delta/package/package.xml \
            --title "$RELEASE_TAG" \
            --notes "SIT deployment succeeded. Baseline: ${{ steps.baseline.outputs.from_ref }}. Revision: $GITHUB_SHA. The attached ledger maps every delta component to this release tag."

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-deployment-${{ github.run_number }}
          path: |
            delta/package/package.xml
            delta/destructiveChanges/destructiveChanges.xml
            delta/component-version-map.csv
          if-no-files-found: ignore
          retention-days: 90

      - name: Logout and remove auth file
        if: always()
        shell: bash
        run: |
          sf org logout --target-org "$SF_TARGET_ORG" --no-prompt || true
          rm -f .sf-auth-url.txt
