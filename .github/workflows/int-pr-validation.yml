name: INT PR Validation

on:
  pull_request:
    branches: [int]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: int-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: int-validation
    timeout-minutes: 60
    env:
      SF_TARGET_ORG: INT
      SF_TEST_LEVEL: RunLocalTests
      SGD_VERSION: 7.2.0

    steps:
      - name: Checkout PR commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Salesforce CLI and SGD
        run: |
          npm install --global @salesforce/cli@2
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"

      - name: Authenticate to INT
        env:
          SFDX_AUTH_URL: ${{ secrets.INT_SFDX_AUTH_URL }}
        run: ./scripts/authenticate.sh "$SF_TARGET_ORG"

      - name: Generate PR delta
        env:
          FROM_REF: ${{ github.event.pull_request.base.sha }}
          TO_REF: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/generate-delta.sh "$FROM_REF" "$TO_REF" delta

      - name: Validate delta against INT
        run: ./scripts/deploy-delta.sh validate delta "$SF_TARGET_ORG" "$SF_TEST_LEVEL"
