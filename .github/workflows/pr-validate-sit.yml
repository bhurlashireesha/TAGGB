# Workflow name shown in GitHub Actions UI
name: SIT PR Validation

on:
  # Trigger when a pull request targets the sit branch
  pull_request:
    branches: [sit]
    types: [opened, synchronize, reopened, ready_for_review]

# Permissions needed to read repository contents
permissions:
  contents: read

# Ensure only one SIT PR validation runs per PR at a time
concurrency:
  group: sit-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # Skip validation if the PR is still a draft
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: sit-validation
    timeout-minutes: 60
    env:
      SF_TARGET_ORG: SIT          # Target Salesforce org alias
      SF_TEST_LEVEL: RunLocalTests # Test level for validation
      SGD_VERSION: 7.2.0          # Version of sfdx-git-delta plugin

    steps:
      # Step 1: Checkout the PR commit with full history
      - name: Checkout PR commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Step 2: Install Salesforce CLI and sfdx-git-delta plugin
      - name: Install Salesforce CLI and SGD
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @salesforce/cli@2
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf version
          sf plugins

      # Step 3: Authenticate to SIT org using stored auth URL
      - name: Authenticate to SIT
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: ./scripts/authenticate.sh "$SF_TARGET_ORG"

      # Step 4: Generate delta package between base and head commits
      - name: Generate PR delta
        shell: bash
        env:
          FROM_REF: ${{ github.event.pull_request.base.sha }}
          TO_REF: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/generate-delta.sh "$FROM_REF" "$TO_REF" delta

      # Step 5: Validate delta against SIT org
      - name: Validate delta against SIT
        id: validate
        shell: bash
        run: ./scripts/deploy-delta.sh validate delta "$SF_TARGET_ORG" "$SF_TEST_LEVEL"

      # Step 6: Upload generated manifests as artifacts for traceability
      - name: Upload generated manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-pr-delta-${{ github.event.pull_request.number }}
          path: |
            delta/package/package.xml
            delta/destructiveChanges/destructiveChanges.xml
            delta/component-version-map.csv
          if-no-files-found: ignore
          retention-days: 14

      # Step 7: Logout and cleanup auth files
      - name: Logout and remove auth file
        if: always()
        shell: bash
        run: |
          sf org logout --target-org "$SF_TARGET_ORG" --no-prompt || true
          rm -f .sf-auth-url.txt
